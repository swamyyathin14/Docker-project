 name: Docker
 on:
  push:
    branches: ["main']
  jobs:
    deploy:
      runs-on: self-hosted
      steps: 
        - uses: actions/checkout@v4
        - name: Build docker image
          run: docker build -t app .
        - name: run docker container
          run: |
           docker run -d -p 80:80 --name web app
