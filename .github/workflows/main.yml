
name: Docker

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app .

      - name: Remove old container if exists
        run: |
          docker rm -f web || true

      - name: Run Docker container
        run: docker run -d -p 80:80 --name web app
